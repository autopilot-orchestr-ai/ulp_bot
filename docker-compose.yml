version: '3.8'

services:
  ulp_bot:
  build: .
  container_name: ulp_bot
  restart: always
  env_file:
    - .env
  networks:
    - shared_network
  environment:
    - CLIENT_ID=client_a
    - TELEGRAM_TOKEN=12345:ABC...
    - API_URL=http://admin_api:8000

networks:
  shared_network:
    external: true                
en:
  - question: What services does United Legal Partners offer?
    answer: >
      United Legal Partners offers a wide range of legal and consulting services in Prague:

      ⚖️ Legal consultations: from 1,900 CZK (online 30 min) to 3,300 CZK (60 min). Consultation with JUDr. Ulyana Kurivchakova — 5,000 CZK (60 min).
      🛂 Visa consultations: from 1,200 CZK (online 30 min) to 1,900 CZK (60 min).
      📄 Certified translations: 600 CZK / standard page (takes 2–3 business days).
      🔏 Apostille services: 4,000 CZK (for Czech or Ukrainian documents).
      📑 Powers of attorney: 3,000 CZK (Czech/Ukrainian) or 3,500 CZK (English/Russian).
      ✍️ Official statements (child travel consent, inheritance): from 3,000 CZK.
      🏛️ Criminal record certificate from Ukraine: 3,500 CZK (standard) or 5,000 CZK (express).
      🗂️ Duplicate documents from Ukraine: 5,000 CZK (without apostille) or 6,300 CZK (with apostille).
      💍 Marriage support package: 14,000 CZK + 21% VAT.
      🛡️ Court representation & criminal defense: available upon consultation.
  - question: Where are you located?
    answer: >
      We have two offices in Prague:
      Pařížská 127/20, Praha 1 – Josefov
      U Prašné brány 3, Praha 1, 110 00
      Nearest metro: Staroměstská or Náměstí Republiky.
  - question: What are your working hours?
    answer: >
      We work Monday to Friday, 8:00–17:00 (lunch break 12:00–13:00).
      We are closed on weekends and public holidays.
  - question: How can I contact you?
    answer: >
      Phone: +420 703 614 444 or +420 722 222 433
      Email: office@ak-ulp.cz
      You can also reach us via WhatsApp, Telegram, or Instagram.
  - question: What languages do you work in?
    answer: We provide services in Ukrainian, Czech, English, and Russian.
  - question: How much does a legal consultation cost?
    answer: >
      Legal consultation (online only): 30 minutes — 1 900 CZK.
      Legal consultation (online or in-person): 60 minutes — 3 300 CZK.
      Consultations with JUDr. Ulyana Kurivchakova: 60 minutes — 5 000 CZK (in-person only).
  - question: How much does a visa consultation cost?
    answer: >
      Visa consultation (online only): 30 minutes — 1 200 CZK.
      Visa consultation (online or in-person): 60 minutes — 1 900 CZK.
  - question: How are online consultations conducted?
    answer: >
      Online consultations take place by phone call, WhatsApp video/call (for clients without a Czech number),
      or via a Zoom meeting link that we send you.
  - question: Is payment required before the consultation?
    answer: >
      Yes. Your slot is reserved only after full prepayment.
      After you select a time, we will send you payment details.
      Once we receive your payment receipt, a manager will confirm your appointment.
  - question: What is the cancellation and rescheduling policy?
    answer: >
      You may cancel or reschedule your consultation free of charge up to 72 hours before the appointment.
      Cancellations with less than 72 hours notice may result in loss of the prepayment.
  - question: How much does document translation cost?
    answer: >
      Translation costs 600 CZK per standard page (normostrana).
      You must bring the originals or notarised copies to our office in person — we cannot accept scans for translation.
  - question: Do you do apostille?
    answer: >
      Yes, we can arrange apostille services for documents. Please contact our office for details and pricing.
  - question: Can you draft a power of attorney?
    answer: >
      Yes. We draft powers of attorney in Ukrainian, Czech, or English.
      Signature verification is done by a Czech notary, even for Ukrainian-language documents.
      For details on required documents, please contact our manager directly — the requirements depend on the specific purpose of the power of attorney.
  - question: Can you draft consent for a child to travel abroad?
    answer: >
      Yes. We draft travel consent documents. Please contact our manager to discuss the details,
      as requirements vary depending on the situation.
  - question: Can you obtain duplicate documents from Ukraine?
    answer: >
      Yes. We can obtain duplicate birth certificates, marriage certificates, and criminal record certificates from Ukraine.
      Contact us to discuss the process and costs.
  - question: What legal matters require a lawyer's consultation first?
    answer: >
      For complex matters — such as divorce, criminal proceedings, loss of driving licence, appeals,
      refused temporary protection, real estate contract review, or full legal representation —
      we recommend booking a legal consultation first so the lawyer can assess your case and advise on next steps.
  - question: How do I book a consultation?
    answer: >
      To book a consultation, please contact our manager directly via phone or messaging apps (+420 703 614 444).

uk:
  - question: Які послуги надає United Legal Partners?
    answer: >
      United Legal Partners надає широкий спектр юридичних та консалтингових послуг у Празі:

      ⚖️ Юридичні консультації: від 1 900 CZK (онлайн 30 хв) до 3 300 CZK (60 хв). Консультація з JUDr. Уляною Курівчаковою — 5 000 CZK (60 хв).
      🛂 Візові консультації: від 1 200 CZK (онлайн 30 хв) до 1 900 CZK (60 хв).
      📄 Завірені судові переклади: 600 CZK / нормосторінка (термін 2–3 робочі дні).
      🔏 Апостиль документів: 4 000 CZK (для чеських та українських документів).
      📑 Складення довіреностей: 3 000 CZK (чеська/українська) або 3 500 CZK (англійська/російська).
      ✍️ Офіційні заяви (згода на виїзд дитини, спадщина): від 3 000 CZK.
      🏛️ Довідка про несудимість з України: 3 500 CZK (стандарт) або 5 000 CZK (експрес).
      🗂️ Замовлення дублікатів документів з України: 5 000 CZK (без апостилю) або 6 300 CZK (з апостилем).
      💍 Супровід при одруженні в Чехії: 14 000 CZK + 21% ПДВ.
      🛡️ Представництво в суді та захист у кримінальних провадженнях: за домовленістю після консультації.
  - question: Де знаходиться офіс?
    answer: >
      У нас два офіси в Празі:
      Pařížská 127/20, Praha 1 – Josefov
      U Prašné brány 3, Praha 1, 110 00
      Найближче метро: Staroměstská або Náměstí Republiky.
  - question: Який графік роботи?
    answer: >
      Ми працюємо з понеділка по п'ятницю з 8:00 до 17:00 (обідня перерва з 12:00 до 13:00).
      У вихідні та святкові дні офіс зачинено.
  - question: Як з вами зв'язатися?
    answer: >
      Телефон: +420 703 614 444 або +420 722 222 433
      Email: office@ak-ulp.cz
      Також можна написати у WhatsApp, Telegram або Instagram.
  - question: Якими мовами ви надаєте послуги?
    answer: Ми надаємо послуги українською, чеською, англійською та російською мовами.
  - question: Скільки коштує юридична консультація?
    answer: >
      Юридична консультація (тільки онлайн): 30 хвилин — 1 900 крон.
      Юридична консультація (онлайн або офлайн): 60 хвилин — 3 300 крон.
      Консультація з JUDr. Уляною Курівчаковою: 60 хвилин — 5 000 крон (тільки очно).
  - question: Скільки коштує візова консультація?
    answer: >
      Візова консультація (тільки онлайн): 30 хвилин — 1 200 крон.
      Візова консультація (онлайн або офлайн): 60 хвилин — 1 900 крон.
  - question: Як проходять онлайн-консультації?
    answer: >
      Онлайн-консультації проводяться по телефону, через WhatsApp (для клієнтів без чеського номера)
      або через посилання на Zoom, яке ми надсилаємо.
  - question: Чи потрібна передоплата?
    answer: >
      Так. Час консультації закріплюється лише після повної передоплати.
      Після вибору часу ми надсилаємо реквізити для оплати.
      Після отримання квитанції менеджер підтверджує запис.
  - question: Яка політика скасування та перенесення запису?
    answer: >
      Ви можете скасувати або перенести консультацію безкоштовно не пізніше ніж за 72 години до початку.
      При скасуванні менш ніж за 72 години передоплата може не повертатися.
  - question: Скільки коштує переклад документів?
    answer: >
      Переклад коштує 600 крон за нормосторінку.
      Оригінали або завірені копії документів необхідно принести до офісу особисто — скани для перекладу не приймаються.
  - question: Чи робите ви апостиль?
    answer: >
      Так, ми надаємо послуги апостилю. Зверніться до нашого офісу за деталями та вартістю.
  - question: Чи складаєте ви довіреності?
    answer: >
      Так. Ми складаємо довіреності українською, чеською або англійською мовою.
      Засвідчення підпису проводиться у чеського нотаріуса, навіть для документів українською мовою.
      Для уточнення переліку необхідних документів зверніться до нашого менеджера — вимоги залежать від мети довіреності.
  - question: Чи замовляєте дублікати документів з України?
    answer: >
      Так. Ми можемо замовити дублікати свідоцтв про народження, одруження та довідки про несудимість з України.
      Зверніться до нас для уточнення процесу та вартості.
  - question: Які питання потребують юридичної консультації?
    answer: >
      Для складних питань — розлучення, кримінальні провадження, позбавлення прав,
      апеляції, відмова у тимчасовому захисті, аналіз договору купівлі нерухомості
      або повний юридичний супровід — рекомендуємо спочатку записатися на консультацію.
  - question: Як записатися на консультацію?
    answer: >
      Щоб записатися на консультацію, зв'яжіться з нашим менеджером за телефоном +420 703 614 444 або у месенджерах.

cs:
  - question: Jaké služby United Legal Partners nabízí?
    answer: >
      United Legal Partners nabízí širokou škálu právních a konzultačních služeb v Praze:

      ⚖️ Právní konzultace: od 1 900 Kč (online 30 min) do 3 300 Kč (60 min). Konzultace s JUDr. Uljanou Kurivčakovou — 5 000 Kč (60 min).
      🛂 Vízové konzultace: od 1 200 Kč (online 30 min) do 1 900 Kč (60 min).
      📄 Soudní překlady: 600 Kč / normostránka (lhůta 2–3 pracovní dny).
      🔏 Apostila: 4 000 Kč (pro české i ukrajinské dokumenty).
      📑 Plné moci: 3 000 Kč (čeština/ukrajinština) nebo 3 500 Kč (angličtina/ruština).
      ✍️ Oficiální prohlášení (souhlas s cestou dítěte, dědictví): od 3 000 Kč.
      🏛️ Výpis z rejstříku trestů z Ukrajiny: 3 500 Kč (standard) nebo 5 000 Kč (expres).
      🗂️ Duplikáty dokumentů z Ukrajiny: 5 000 Kč (bez apostily) nebo 6 300 Kč (s apostilou).
      💍 Doprovod při uzavření manželství: 14 000 Kč + 21% DPH.
      🛡️ Zastoupení u soudu a obhajoba v trestních věcech: dle dohody po konzultaci.
  - question: Kde se nacházíte?
    answer: >
      Máme dvě kanceláře v Praze:
      Pařížská 127/20, Praha 1 – Josefov
      U Prašné brány 3, Praha 1, 110 00
      Nejbližší metro: Staroměstská nebo Náměstí Republiky.
  - question: Jaká je vaše pracovní doba?
    answer: >
      Pracujeme od pondělí do pátku od 8:00 do 17:00 (polední přestávka 12:00–13:00).
      O víkendech a státních svátcích jsme zavřeni.
  - question: Jak vás mohu kontaktovat?
    answer: >
      Telefon: +420 703 614 444 nebo +420 722 222 433
      E-mail: office@ak-ulp.cz
      Můžete nás také kontaktovat přes WhatsApp, Telegram nebo Instagram.
  - question: V jakých jazycích poskytujete služby?
    answer: Poskytujeme služby v ukrajinštině, češtině, angličtině a ruštině.
  - question: Kolik stojí právní konzultace?
    answer: >
      Právní konzultace (pouze online): 30 minut — 1 900 Kč.
      Právní konzultace (online nebo osobně): 60 minut — 3 300 Kč.
      Konzultace s JUDr. Uljanou Kurivčakovou: 60 minut — 5 000 Kč (pouze osobně).
  - question: Kolik stojí vízová konzultace?
    answer: >
      Vízová konzultace (pouze online): 30 minut — 1 200 Kč.
      Vízová konzultace (online nebo osobně): 60 minut — 1 900 Kč.
  - question: Je nutná záloha?
    answer: >
      Ano. Termín je rezervován až po úplné platbě předem.
      Po výběru času vám zašleme platební údaje.
      Po obdržení dokladu o platbě manažer potvrdí rezervaci.
  - question: Jaká je politika zrušení a přesunutí termínu?
    answer: >
      Termín můžete zrušit nebo přesunout zdarma nejpozději 72 hodin předem.
      Při zrušení s méně než 72 hodinovým předstihem může být záloha nevratná.
  - question: Kolik stojí překlad dokumentů?
    answer: >
      Překlad stojí 600 Kč za normostránku.
      Originály nebo ověřené kopie je nutné přinést osobně do kanceláře — skeny pro překlad nepřijímáme.
  - question: Jak si rezervovat konzultaci?
    answer: >
      Pro rezervaci konzultace kontaktujte prosím našeho manažera telefonicky nebo přes WhatsApp (+420 703 614 444).

ru:
  - question: Какие услуги предоставляет United Legal Partners?
    answer: >
      United Legal Partners предоставляет широкий спектр юридических и консалтинговых услуг в Праге:

      ⚖️ Юридические консультации: от 1 900 CZK (онлайн 30 мин) до 3 300 CZK (60 мин). Консультация с JUDr. Ульяной Куривчаковой — 5 000 CZK (60 мин).
      🛂 Визовые консультации: от 1 200 CZK (онлайн 30 мин) до 1 900 CZK (60 мин).
      📄 Заверенные судебные переводы: 600 CZK / нормостраница (срок 2–3 рабочих дня).
      🔏 Апостиль документов: 4 000 CZK (для чешских и украинских документов).
      📑 Составление доверенностей: 3 000 CZK (чешский/украинский) или 3 500 CZK (английский/русский).
      ✍️ Официальные заявления (согласие на выезд ребёнка, наследство): от 3 000 CZK.
      🏛️ Справка об отсутствии судимости из Украины: 3 500 CZK (стандарт) или 5 000 CZK (экспресс).
      🗂️ Заказ дубликатов документов из Украины: 5 000 CZK (без апостиля) или 6 300 CZK (с апостилем).
      💍 Сопровождение при бракосочетании в Чехии: 14 000 CZK + 21% НДС.
      🛡️ Представительство в суде и защита по уголовным делам: по договоренности после консультации.
  - question: Где находится офис?
    answer: >
      У нас два офиса в Праге:
      Pařížská 127/20, Praha 1 – Josefov
      U Prašné brány 3, Praha 1, 110 00
      Ближайшее metro: Staroměstská или Náměstí Republiky.
  - question: Каков режим работы?
    answer: >
      Мы работаем с понедельника по пятницу с 8:00 до 17:00 (обеденный перерыв с 12:00 до 13:00).
      В выходные и праздничные дни офис закрыт.
  - question: Как с вами связаться?
    answer: >
      Телефон: +420 703 614 444 или +420 722 222 433
      Email: office@ak-ulp.cz
      Также можно написать в WhatsApp, Telegram или Instagram.
  - question: На каких языках вы работаете?
    answer: Мы предоставляем услуги на украинском, чешском, английском и русском языках.
  - question: Сколько стоит юридическая консультация?
    answer: >
      Юридическая консультация (только онлайн): 30 минут — 1 900 крон.
      Юридическая консультация (онлайн или очно): 60 минут — 3 300 крон.
      Консультация с JUDr. Ульяной Куривчаковой: 60 минут — 5 000 крон (только очно).
  - question: Сколько стоит визовая консультация?
    answer: >
      Визовая консультация (только онлайн): 30 минут — 1 200 крон.
      Визовая консультация (онлайн или очно): 60 минут — 1 900 крон.
  - question: Нужна ли предоплата?
    answer: >
      Да. Время консультации закрепляется только после полной предоплаты.
      После выбора времени мы высылаем реквизиты для оплаты.
      После получения квитанции менеджер подтверждает запись.
  - question: Какова политика отмены и переноса записи?
    answer: >
      Вы можете отменить или перенести консультацию бесплатно не позднее чем за 72 часа до начала.
      При отмене менее чем за 72 часа предоплата может не возвращаться.
  - question: Сколько стоит перевод документов?
    answer: >
      Перевод стоит 600 крон за нормостраницу.
      Оригиналы или нотариально заверенные копии необходимо принести в офис лично — сканы для перевода не принимаются.
  - question: Как записаться на консультацию?
    answer: >
      Чтобы записаться на консультацию, свяжитесь с нашим менеджером по телефону +420 703 614 444 или в мессенджерах.